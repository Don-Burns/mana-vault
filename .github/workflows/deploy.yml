name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the test suite (manual runs only — pushes to main always run tests)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    if: github.event.inputs.skip_tests != 'true'
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    # Runs if tests passed, or if they were legitimately skipped via the
    # manual workflow_dispatch toggle above — never runs on a real failure.
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # Pre-built by `deno task db:release` locally and uploaded as a Release
      # asset — CI does not run the multi-hour Scryfall bulk-art download.
      - name: Download hash DB
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p public/db
          gh release download db-latest --repo "$GITHUB_REPOSITORY" \
            --pattern 'hash-db.bin' --pattern 'metadata.json' --pattern 'version.json' \
            --dir public/db --clobber

      - name: Download OpenCV.js
        run: deno task opencv:download

      - name: Build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: deno task build

      - run: touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
